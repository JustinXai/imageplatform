<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录中...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f9fafb;
        }
        .card {
            text-align: center;
            padding: 48px 32px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            max-width: 400px;
            width: 90%;
        }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid #e5e7eb;
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { font-size: 18px; margin-bottom: 8px; color: #111; }
        p { font-size: 14px; color: #6b7280; }
        .btn {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 32px;
            background: #111;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .btn:hover { background: #333; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
<div class="card" id="card">
    <div class="spinner"></div>
    <h2>正在处理登录...</h2>
    <p id="msg">请稍候</p>
</div>

<script>
(async function() {
    const params = new URLSearchParams(window.location.search);
    const type = params.get('type');
    const code = params.get('code');

    if (!type || !code) {
        document.getElementById('card').innerHTML = '<h2 class="error">参数错误</h2><p>缺少必要的登录参数</p><a href="/login" class="btn">返回登录</a>';
        return;
    }

    try {
        const res = await fetch('/api/auth?type=' + encodeURIComponent(type) + '&code=' + encodeURIComponent(code) + '&_action=social_callback');
        const data = await res.json();

        if (!data.ok) {
            document.getElementById('card').innerHTML = '<h2 class="error">登录失败</h2><p>' + (data.message || '未知错误') + '</p><a href="/login" class="btn">返回登录</a>';
            return;
        }

        if (data.data.bind_status === 'unbound') {
            // 未绑定 → 跳转到登录页并带上绑定参数
            const bindParams = new URLSearchParams({
                bind: '1',
                type: data.data.type,
                social_uid: data.data.social_uid,
                access_token: data.data.access_token || '',
                nickname: data.data.nickname || '',
                faceimg: data.data.faceimg || ''
            });
            window.location.href = '/login?' + bindParams.toString();
            return;
        }

        // 已绑定 → 登录成功，跳转
        window.location.href = data.data.redirect || '/user/index';
    } catch(e) {
        document.getElementById('card').innerHTML = '<h2 class="error">网络错误</h2><p>请检查网络后重试</p><a href="/login" class="btn">返回登录</a>';
    }
})();
</script>
</body>
</html>
